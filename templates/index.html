{% extends 'base.html' %}
{% load static %}
{% block content %}
    <main>
        <!-- Section About Me / Profile -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Information System &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="{% static 'img/filza.png' %}" alt="Photo of {{ name }}">
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program Studi</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/filzashafira" class="social-link" target="_blank" rel="noopener">GitHub</a>
                        <a href="https://www.linkedin.com/in/filzashfrr" class="social-link" target="_blank" rel="noopener">LinkedIn</a>
                        <a href="mailto:filza.shafira@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>

    </main>
{% endblock content %}
